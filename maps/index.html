<!doctype html>
<!-- Gegenereerd door tools/pages.mjs uit pages/maps.html: wijzig het sjabloon en draai node tools/pages.mjs -->
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Inn the Grid · Kev’s Inn</title>
<meta name="robots" content="noindex">
<meta name="theme-color" content="#241811" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#1d130d" media="(prefers-color-scheme: dark)">
<script src="/js/theme.js"></script>
<link rel="icon" href="/icons/icon.svg" type="image/svg+xml">
<link rel="stylesheet" href="/css/app.css">
<link rel="stylesheet" href="/css/maps.css">
<script type="module" src="/js/maps/main.js"></script>
</head>
<!-- Inn the Grid (G4, WP56): geen manifest-link en geen it-version (docs/i18n.md §9.2 stap 2; installeren = D7, WP67) -->
<body class="maps">
<header class="mtop">
  <a class="mhome" href="/" aria-label="Kev’s Inn home page"><!-- embleem: zelfde tekening als EMBLEM in tools/icons.mjs --><svg class="emb" viewBox="20 2 176 196" aria-hidden="true" focusable="false" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round"><path d="M108 16 181 58v84l-73 42-73-42V58Z" stroke-width="11"/><g transform="translate(0 13)" stroke-width="10"><path d="M100 47v-8q8-10 16 0v8"/><path d="M88 55h40l-8 11H96Z"/><path d="M96 70h24l8 10v42H88V80Z"/><path d="M84 130h48"/></g><path d="M108 102c-9 10-9 19 0 26 9-7 9-16 0-26Z" fill="currentColor" stroke="none"/></svg></a>
  <!-- WP58: in de editor de kaartnaam met daaronder de opslagstatus (altijd zichtbaar); in de lijst "Inn the Grid" -->
  <div class="mtitle"><h1 id="m-name">Inn the Grid</h1><div class="mstat" id="m-stat" aria-live="off"></div></div>
  <span class="mver" id="m-ver"></span>
</header>
<main class="mstage" id="m-stage">
  <canvas id="m-canvas" role="img"></canvas>
</main>
<!-- WP58: Mijn kaarten. Eigen weergave in dezelfde pagina (editor verborgen, history.pushState: terug = editor). Rij-tik
     opent, ⋯ opent het menu (Hernoemen, Dupliceren, Verwijderen). Lijst en meldingen vult js/maps/main.js. -->
<main class="mkl" id="m-list" hidden aria-labelledby="m-l-title">
  <h2 id="m-l-title">My maps</h2>
  <p class="mwarn" id="m-l-off" hidden>Maps aren’t stored in this browser (private browsing, or storage is turned off). You can still draw, but your map is gone when you close the page.</p>
  <p class="hint" id="m-l-empty" hidden>No maps yet. Start one with New map.</p>
  <ul class="mkl-rows" id="m-lrows"></ul>
</main>
<nav class="mdock" id="m-ldock" aria-label="Map list controls" hidden>
  <button type="button" class="btn" id="m-back">Back to map</button>
  <button type="button" class="btn primary" id="m-new">New map</button>
</nav>
<nav class="mdock" id="m-dock" aria-label="Map controls">
  <button type="button" class="btn" id="m-maps" aria-label="My maps"><!-- WP58: lijst-icoon inline (geen gedeeld icoon: icons/ui.svg hoort bij Initiative) --><svg class="li" viewBox="0 0 24 24" aria-hidden="true" focusable="false" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M9 6h11M9 12h11M9 18h11"/><circle cx="4.5" cy="6" r="1" fill="currentColor"/><circle cx="4.5" cy="12" r="1" fill="currentColor"/><circle cx="4.5" cy="18" r="1" fill="currentColor"/></svg></button>
  <div class="mzoom">
    <button type="button" class="btn" id="m-out" aria-label="Zoom out"><span aria-hidden="true">−</span></button>
    <output id="m-zoom" aria-label="Zoom level" aria-live="polite"></output>
    <button type="button" class="btn" id="m-in" aria-label="Zoom in"><span aria-hidden="true">+</span></button>
  </div>
  <div class="mright">
    <button type="button" class="btn" id="m-fit" aria-label="Fit map"><span class="mfit-t" aria-hidden="true">Fit map</span><svg class="li mfit-i" viewBox="0 0 24 24" aria-hidden="true" focusable="false" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 9V4h5M20 9V4h-5M4 15v5h5M20 15v5h-5"/></svg></button>
    <button type="button" class="btn" id="m-set" aria-label="Map settings" aria-expanded="false" aria-controls="m-sheet"><svg class="li" aria-hidden="true" focusable="false"><use href="/icons/ui.svg#i-gear"/></svg></button>
  </div>
</nav>
<!-- WP57: paneel Kaart. Geen dim: de kaart blijft erboven zichtbaar en bedienbaar, zodat elke wijziging direct te zien is
     (max ± 55 % hoogte). Niet-modaal; Esc of Close sluit, focus terug naar de tandwielknop. -->
<section class="msheet" id="m-sheet" role="dialog" aria-labelledby="m-s-title" tabindex="-1" hidden>
  <div class="grab" aria-hidden="true"></div>
  <div class="shead"><h3 id="m-s-title">Map</h3><button type="button" class="link" id="m-close">Close</button></div>
  <!-- WP58: naam, toegepast bij blur/Enter; leeg = vorige naam terug -->
  <label>Name<input id="m-mname" type="text" enterkeyhint="done" autocomplete="off" maxlength="60" spellcheck="false"></label>
  <div class="mfield"><span class="lab" id="m-type-l">Grid</span>
    <div class="seg" id="m-type" role="group" aria-labelledby="m-type-l"><button type="button" data-v="square">Square</button><button type="button" data-v="pointy">Pointy hex</button><button type="button" data-v="flat">Flat hex</button></div></div>
  <div class="f2">
    <label>Columns<input id="m-cols" type="text" inputmode="numeric" enterkeyhint="done" autocomplete="off" aria-describedby="m-cols-e"><span class="ferr" id="m-cols-e" hidden></span></label>
    <label>Rows<input id="m-rows" type="text" inputmode="numeric" enterkeyhint="done" autocomplete="off" aria-describedby="m-rows-e"><span class="ferr" id="m-rows-e" hidden></span></label>
  </div>
  <div class="mfield"><span class="lab" id="m-show-l">Grid lines</span>
    <div class="seg" id="m-show" role="group" aria-labelledby="m-show-l"><button type="button" data-v="on">On</button><button type="button" data-v="off">Off</button></div></div>
  <div class="mfield"><span class="lab" id="m-color-l">Line color</span>
    <div class="seg" id="m-color" role="group" aria-labelledby="m-color-l"><button type="button" data-v="auto">Auto</button><button type="button" data-v="dark">Dark</button><button type="button" data-v="light">Light</button><button type="button" data-v="gold">Gold</button></div></div>
  <div class="mfield"><span class="lab" id="m-alpha-l">Line opacity</span>
    <div class="seg" id="m-alpha" role="group" aria-labelledby="m-alpha-l"><button type="button" data-v="25"></button><button type="button" data-v="50"></button><button type="button" data-v="75"></button><button type="button" data-v="100"></button></div></div>
</section>
<!-- WP58: menu en hernoemen voor een kaart uit de lijst (modaal, met dim) -->
<div class="sheet-wrap" id="m-menu" hidden>
  <div class="dim" data-m="close"></div>
  <div class="sheet" id="m-menu-s" tabindex="-1" role="dialog" aria-modal="true" aria-labelledby="m-menu-t"></div>
</div>
<div class="toast" id="m-toast" role="status" aria-live="polite"></div>
</body>
</html>
