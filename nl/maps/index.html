<!doctype html>
<!-- Gegenereerd door tools/pages.mjs uit pages/maps.html: wijzig het sjabloon en draai node tools/pages.mjs -->
<html lang="nl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Inn the Grid · Kev’s Inn</title>
<meta name="robots" content="noindex">
<meta name="theme-color" content="#241811" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#1d130d" media="(prefers-color-scheme: dark)">
<script src="/js/theme.js"></script>
<link rel="icon" href="/icons/icon.svg" type="image/svg+xml">
<link rel="stylesheet" href="/css/app.css">
<link rel="stylesheet" href="/css/maps.css">
<script type="module" src="/js/maps/main.js"></script>
</head>
<!-- Inn the Grid (G4, WP56): geen manifest-link en geen it-version (docs/i18n.md §9.2 stap 2; installeren = D7, WP67) -->
<body class="maps">
<header class="mtop">
  <a class="mhome" href="/nl/" aria-label="Homepage van Kev’s Inn"><!-- embleem: zelfde tekening als EMBLEM in tools/icons.mjs --><svg class="emb" viewBox="20 2 176 196" aria-hidden="true" focusable="false" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round"><path d="M108 16 181 58v84l-73 42-73-42V58Z" stroke-width="11"/><g transform="translate(0 13)" stroke-width="10"><path d="M100 47v-8q8-10 16 0v8"/><path d="M88 55h40l-8 11H96Z"/><path d="M96 70h24l8 10v42H88V80Z"/><path d="M84 130h48"/></g><path d="M108 102c-9 10-9 19 0 26 9-7 9-16 0-26Z" fill="currentColor" stroke="none"/></svg></a>
  <h1>Inn the Grid</h1>
  <span class="mver" id="m-ver"></span>
</header>
<main class="mstage" id="m-stage">
  <canvas id="m-canvas" role="img"></canvas>
</main>
<nav class="mdock" aria-label="Kaartbediening">
  <div class="mzoom">
    <button type="button" class="btn" id="m-out" aria-label="Uitzoomen"><span aria-hidden="true">−</span></button>
    <output id="m-zoom" aria-label="Zoomniveau" aria-live="polite"></output>
    <button type="button" class="btn" id="m-in" aria-label="Inzoomen"><span aria-hidden="true">+</span></button>
  </div>
  <div class="mright">
    <button type="button" class="btn" id="m-fit">Hele kaart</button>
    <button type="button" class="btn" id="m-set" aria-label="Kaartinstellingen" aria-expanded="false" aria-controls="m-sheet"><svg class="li" aria-hidden="true" focusable="false"><use href="/icons/ui.svg#i-gear"/></svg></button>
  </div>
</nav>
<!-- WP57: paneel Kaart. Geen dim: de kaart blijft erboven zichtbaar en bedienbaar, zodat elke wijziging direct te zien is
     (max ± 55 % hoogte). Niet-modaal; Esc of Close sluit, focus terug naar de tandwielknop. -->
<section class="msheet" id="m-sheet" role="dialog" aria-labelledby="m-s-title" tabindex="-1" hidden>
  <div class="grab" aria-hidden="true"></div>
  <div class="shead"><h3 id="m-s-title">Kaart</h3><button type="button" class="link" id="m-close">Sluiten</button></div>
  <div class="mfield"><span class="lab" id="m-type-l">Raster</span>
    <div class="seg" id="m-type" role="group" aria-labelledby="m-type-l"><button type="button" data-v="square">Vierkant</button><button type="button" data-v="pointy">Hex punt</button><button type="button" data-v="flat">Hex plat</button></div></div>
  <div class="f2">
    <label>Kolommen<input id="m-cols" type="text" inputmode="numeric" enterkeyhint="done" autocomplete="off" aria-describedby="m-cols-e"><span class="ferr" id="m-cols-e" hidden></span></label>
    <label>Rijen<input id="m-rows" type="text" inputmode="numeric" enterkeyhint="done" autocomplete="off" aria-describedby="m-rows-e"><span class="ferr" id="m-rows-e" hidden></span></label>
  </div>
  <div class="mfield"><span class="lab" id="m-show-l">Rasterlijnen</span>
    <div class="seg" id="m-show" role="group" aria-labelledby="m-show-l"><button type="button" data-v="on">Aan</button><button type="button" data-v="off">Uit</button></div></div>
  <div class="mfield"><span class="lab" id="m-color-l">Lijnkleur</span>
    <div class="seg" id="m-color" role="group" aria-labelledby="m-color-l"><button type="button" data-v="auto">Auto</button><button type="button" data-v="dark">Donker</button><button type="button" data-v="light">Licht</button><button type="button" data-v="gold">Goud</button></div></div>
  <div class="mfield"><span class="lab" id="m-alpha-l">Lijndekking</span>
    <div class="seg" id="m-alpha" role="group" aria-labelledby="m-alpha-l"><button type="button" data-v="25"></button><button type="button" data-v="50"></button><button type="button" data-v="75"></button><button type="button" data-v="100"></button></div></div>
</section>
</body>
</html>
