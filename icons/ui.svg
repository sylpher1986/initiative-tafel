<svg xmlns="http://www.w3.org/2000/svg">
<!-- Lijn-iconen voor de interface (WP17, HS7). 24-grid, 2 px lijn, ronde uiteinden. Eigen tekeningen, behalve
     pen en tandwiel (naar Feather Icons, MIT, Cole Bemis; zie README).
     Gebruik: ico("naam") in js/ui/icons.js → <svg class="li"><use href="icons/ui.svg#i-naam"/></svg>; kleur = currentColor.
     tests/icons.test.js bewaakt dat elke gebruikte naam hier bestaat. -->
